<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aichatt</title>
<style>
  /* 中性灰极简纯色底,无玻璃拟态。
     2026-10-08 方案B「描线绘制」:等待态只显示 logo;连不上时才浮现错误文案 + 重试。
     2026-11-08 删点阵背景;深色底对齐正文「深渊微光」--background #040508 / --foreground #EEF1FC。
     2026-11-11 方案C「落点」重设计(design/preview-splash-redesign.html 挑稿,C + 只留图形标):
     删 aichatt 字标,仅「八」形标(64px)落光学中心(body padding-bottom 抬升);
     两笔描线后,红点自上方坠落、加速触地压扁回弹落位,一圈涟漪散开。
     动效只用 transform/opacity;reduced-motion 呈终态(红点在位、无涟漪)。
     探测/错误/跳转逻辑零改动,仅 MIN_IN 1150→1800(等红点落定 ~1.56s + 涟漪散尽 ~1.81s)。 */
  :root {
    --bg: #f5f5f7;
    --ink: #1d1d1f;
    --ink-secondary: #6e6e73;
    --line: #d2d2d7;
    --btn-bg: #ffffff;
    --btn-hover: #f0f0f2;
    --accent: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #040508;
      --ink: #eef1fc;
      --ink-secondary: #98989d;
      --line: #3a3a3c;
      --btn-bg: #2c2c2e;
      --btn-hover: #3a3a3c;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* html 也要 overflow:hidden + 背景色:任何意外溢出都不能撑出文档滚动,
     否则 WebView 会露出右侧/底部的灰色滚动条(真机截图反馈的白线事故)。
     背景色同时给到 html,任何过卷/边缘缝隙都跟页面同色,不露白。 */
  html, body { height: 100%; overflow: hidden; }
  html { background-color: var(--bg); }
  body {
    /* padding-bottom 把构图抬到光学中心(略高于几何中心),真机/桌面通用 */
    padding-bottom: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--bg);
    color: var(--ink);
    font-family: -apple-system, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .panel {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
    padding: 0 32px;
  }
  /* 品牌形标:内联 SVG「八」。下落红点的初始偏移只写在动效媒体查询内,
     降级(reduced-motion)下天然呈现终态(红点在位),不会留下空位。 */
  .drawmark { width: 64px; height: 49px; display: block; color: var(--ink); }
  .dropdot { transform-box: fill-box; transform-origin: center; }
  .ripple {
    opacity: 0;
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.2;
    transform-box: fill-box;
    transform-origin: center;
  }
  /* 错误态(等待态不显示任何文字):文案 + 重试按钮 */
  .status, button, .hint { display: none; }
  .status { font-size: 13px; color: var(--ink-secondary); min-height: 18px; }
  button {
    padding: 8px 28px;
    font-size: 13px;
    color: var(--ink);
    background: var(--btn-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--btn-hover); }
  button:focus-visible { outline: 2px solid var(--ink-secondary); outline-offset: 2px; }
  .hint { font-size: 11px; color: var(--ink-secondary); opacity: 0.7; }
  body.error .status, body.error button, body.error .hint { display: block; }
  /* 退场拍(探测成功后整体微放大淡出,衔接远端 320ms 淡入) */
  body.leaving .panel { animation: out 300ms ease forwards; }
  @keyframes out { to { opacity: 0; transform: scale(1.04); } }

  @media (prefers-reduced-motion: no-preference) {
    .s1, .s2 { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .s1 { animation: draw 500ms ease-out 140ms forwards; }
    .s2 { animation: draw 500ms ease-out 340ms forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    /* 红点自上方坠落:加速 → 触地压扁 → 回弹落位(920ms 起拍,52% 处触地) */
    .dropdot { transform: translate(0, -64px); animation: drop 640ms 920ms forwards; }
    @keyframes drop {
      0% { transform: translate(0, -64px); animation-timing-function: cubic-bezier(.45,.05,.8,.4); }
      52% { transform: translate(0, 0) scale(1.28, .7); animation-timing-function: cubic-bezier(.2,.6,.35,1); }
      70% { transform: translate(0, -9px) scale(.95, 1.06); }
      86% { transform: translate(0, 0) scale(1.06, .94); }
      100% { transform: none; }
    }
    .ripple { animation: ripple 560ms ease-out 1250ms; }
    @keyframes ripple {
      0% { opacity: .4; transform: scale(.5); }
      100% { opacity: 0; transform: scale(3.2); }
    }
    /* 错误态浮现(红点早已落定,只淡入文字) */
    body.error .status { animation: fade-up 300ms ease both; }
    body.error button { animation: fade-up 300ms ease 80ms both; }
    body.error .hint { animation: fade-up 300ms ease 160ms both; }
    @keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
  <div class="panel">
    <svg class="drawmark" viewBox="0 0 128 98" fill="none" aria-hidden="true">
      <path class="s1" d="M60 6 C46 32 28 60 8 90" stroke="currentColor" stroke-width="14" stroke-linecap="round" pathLength="1"/>
      <path class="s2" d="M68 24 C80 46 98 70 120 90" stroke="currentColor" stroke-width="14" stroke-linecap="round" pathLength="1"/>
      <circle class="dropdot" cx="86" cy="12" r="8" fill="var(--accent)"/>
      <circle class="ripple" cx="86" cy="12" r="8"/>
    </svg>
    <div class="status" id="status">无法连接服务器</div>
    <button id="retry" type="button">重试</button>
    <div class="hint" id="hint"></div>
  </div>
  <script src="./config.js"></script>
  <script>
    // 探测原理:no-cors 模式下 fetch 只在网络层失败时 reject(DNS/连接不通),
    // 服务器返回任何状态码(含 503)都会 resolve opaque 响应 —— 足以判断"能不能连上"。
    // 三拍衔接:入场动画与探测并行互不等待;探测秒回也先播完最短入场闸(MIN_IN,
    // 覆盖红点落定+涟漪散尽),再补一拍退场(EXIT)才整窗跳转,消除"闪一下硬切";
    // 远端有 320ms 淡入接住。
    var ORIGIN = window.AICHATT_ORIGIN
    var retryBtn = document.getElementById('retry')
    var hintEl = document.getElementById('hint')
    var probing = false
    var t0 = 0
    var MIN_IN = 1800
    var EXIT = 300

    function probe() {
      return fetch(ORIGIN + '/', {
        mode: 'no-cors',
        cache: 'no-store',
        signal: AbortSignal.timeout(5000),
      }).then(function () { return true }).catch(function () { return false })
    }

    function showError() {
      probing = false
      document.body.classList.remove('leaving')
      document.body.classList.add('error')
      hintEl.textContent = '请检查网络后重试'
    }

    function leave() {
      document.body.classList.remove('error')
      document.body.classList.add('leaving')
      // cache-busting:WebView 的 HTTP 缓存(app_webview,系统「清除缓存」够不到)曾把
      // 部署前的旧 HTML 锁死不 revalidate,升级 APK 也不清。URL 带时间戳参数绕开
      // 缓存键,每次启动必拿最新 HTML;chunk/字体是 hash 长缓存,不受影响。
      setTimeout(function () { location.replace(ORIGIN + '/?cb=' + Date.now()) }, EXIT)
    }

    function run() {
      probing = true
      t0 = performance.now()
      document.body.classList.remove('error')
      document.body.classList.remove('leaving')
      hintEl.textContent = ''
      probe().then(function (ok) {
        if (!probing) return // 重试后旧探测迟到回执,忽略
        if (ok) {
          // 探测比入场快时补足入场闸;探测慢时直接进入退场
          var wait = Math.max(0, MIN_IN - (performance.now() - t0))
          setTimeout(leave, wait)
        } else {
          showError()
        }
      })
    }

    retryBtn.addEventListener('click', function () {
      if (!probing) run()
    })

    run()
  </script>
</body>
</html>
